name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic tests
        run: npm test

      - name: Write browser-safe runtime configuration
        env:
          NOURISH_SUPABASE_URL: ${{ vars.NOURISH_SUPABASE_URL }}
          NOURISH_SUPABASE_ANON_KEY: ${{ vars.NOURISH_SUPABASE_ANON_KEY }}
          NOURISH_BACKEND_FUNCTION_URL: ${{ vars.NOURISH_BACKEND_FUNCTION_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = {
            supabaseUrl: process.env.NOURISH_SUPABASE_URL || '',
            supabaseAnonKey: process.env.NOURISH_SUPABASE_ANON_KEY || '',
            backendFunctionUrl: process.env.NOURISH_BACKEND_FUNCTION_URL || ''
          };
          fs.writeFileSync('dist/config.js', `window.NOURISH_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
